name: Bug
description: Report something not working correctly (crash, wrong behavior, etc...)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Describe the steps to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Describe the expected result
      description: Describe what you expect to happen instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: If applicable, paste the URL of the video/audio you were trying to download.
  - type: textarea
    id: options
    attributes:
      label: Download Options
      description: List the download options you selected and your app preferences.
  - type: dropdown
    id: platform
    attributes:
      label: App Platform
      options:
        - GNOME (Flatpak)
        - GNOME (Snap)
        - GNOME (Source/AUR)
        - WinUI (Installer)
        - WinUI (Portable)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version Number
      placeholder: e.g., 2.5.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.